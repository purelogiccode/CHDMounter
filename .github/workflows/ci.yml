name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CSharp_CHDMounter.sln

      - name: Build
        run: dotnet build CSharp_CHDMounter.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test CHDMounter.Tests/CHDMounter.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  cross-platform-build:
    name: Cross-platform build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Only the app project is portable; the tests and the Tester tool target
      # net10.0-windows. This verifies the Linux/macOS build stays green.
      - name: Build app
        run: dotnet build CHDMounter/CHDMounter.csproj -c Release
