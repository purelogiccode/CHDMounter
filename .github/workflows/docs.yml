name: Docs

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'WhatsNew.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Deploy documentation site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install docfx
        run: dotnet tool install --global docfx

      - name: Sync changelog from WhatsNew
        run: cp WhatsNew.md docs/changelog.md

      - name: Build documentation
        run: docfx docs/docfx.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  wiki:
    name: Deploy GitHub wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish documentation to the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::warning::The repository wiki is not initialized yet. Open https://github.com/${GITHUB_REPOSITORY}/wiki, create the first page, and re-run this workflow. The wiki pages are generated from docs/."
            exit 0
          fi
          find wiki -maxdepth 1 -name '*.md' -delete
          rm -rf wiki/images
          cp docs/*.md wiki/
          cp docs/_Sidebar.md wiki/_Sidebar.md
          cp WhatsNew.md wiki/changelog.md
          mkdir -p wiki/images
          cp docs/images/* wiki/images/
          mv wiki/index.md wiki/Home.md
          # GitHub wiki links are extension-less: [Page](page.md) -> [Page](page)
          find wiki -maxdepth 1 -name '*.md' -print0 | xargs -0 sed -i -E 's/\]\(([^):#]+)\.md(#[^)]*)?\)/](\1\2)/g'
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update wiki from docs (${GITHUB_REF_NAME})"
          git push
