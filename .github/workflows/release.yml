name: Release

on:
  push:
    tags:
      - 'release_*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CSharp_CHDMounter.sln

      - name: Build
        run: dotnet build CSharp_CHDMounter.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test CHDMounter.Tests/CHDMounter.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  package:
    name: Package bundles (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rids: win-x64,win-arm64
          - os: ubuntu-latest
            rids: linux-x64,linux-arm64
          - os: macos-latest
            rids: osx-x64,osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^release_', ''
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Could not determine version from tag' }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Each runner packs its own platform's bundles so Unix archives keep the
      # executable permission bit.
      - name: Pack release bundles
        shell: pwsh
        run: ./build/pack-release.ps1 -Version "${{ steps.version.outputs.version }}" -OutputDir "${{ github.workspace }}/artifacts" -Runtime "${{ matrix.rids }}"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag='${{ github.ref_name }}'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" artifacts/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file WhatsNew.md
          fi

  docs:
    name: Deploy documentation
    needs: test
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
